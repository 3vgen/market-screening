# Copy to config.toml and put the stores you actually shop at.
# config.toml is gitignored: store codes reveal your approximate location.
#
# Magnit store code: open magnit.ru, pick your store in the header, then
# DevTools -> Network -> goods/search request -> Payload -> storeCode.

[[stores]]
chain = "magnit"
store_code = "000000"
name = "Магнит у дома"

# VkusVill doesn't select a store in search; store_code is just a label.
[[stores]]
chain = "vkusvill"
store_code = "moscow"
name = "ВкусВилл"

[[stores]]
chain = "fixprice"
store_code = "3"          # Fix Price city id, Moscow = 3
name = "Fix Price"

# Browser-based chains (pip install -e ".[browser]"). Use the find_store tool to get codes.
[[stores]]
chain = "pyaterochka"
store_code = "auto"       # or a SAP code like "Y000"; auto = picked by your IP
name = "Пятёрочка"

[[stores]]
chain = "perekrestok"
store_code = "moscow"     # city-level prices; just a label
name = "Перекрёсток"

[[stores]]
chain = "dixy"
store_code = "0000"       # Dixy store id
name = "Дикси"
