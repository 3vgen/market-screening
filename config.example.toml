# Copy to config.toml and put the stores you actually shop at.
# config.toml is gitignored: store codes reveal your approximate location.
#
# Magnit store code: open magnit.ru, pick your store in the header, then
# DevTools -> Network -> goods/search request -> Payload -> storeCode.

[[stores]]
chain = "magnit"
store_code = "000000"
name = "Магнит у дома"

# VkusVill doesn't select a store in search; store_code is just a label.
[[stores]]
chain = "vkusvill"
store_code = "moscow"
name = "ВкусВилл"
